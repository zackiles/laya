steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=TORCH_INDEX=cpu
      - --build-arg=TORCH_VERSION=2.14.0
      - --build-arg=MODELSCOPE_MODEL=english multilingual
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
